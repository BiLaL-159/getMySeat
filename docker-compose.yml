# Local development stack. All credentials here are DEV-ONLY.
name: getmyseat

services:
  postgres:
    # Keep in sync with TestcontainersConfiguration.
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: getmyseat
      POSTGRES_USER: getmyseat
      POSTGRES_PASSWORD: getmyseat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getmyseat -d getmyseat"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    # Keep in sync with KeycloakRealmIT.
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The Keycloak image ships without curl/wget, so probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/getmyseat
      DB_USERNAME: getmyseat
      DB_PASSWORD: getmyseat
      # Tokens are issued to clients on the host, so their iss is the host URL; the backend fetches
      # signing keys over the compose network instead.
      JWT_ISSUER_URI: http://localhost:8180/realms/getmyseat
      JWT_JWK_SET_URI: http://keycloak:8080/realms/getmyseat/protocol/openid-connect/certs
      # The backend's service-account client for the Keycloak Admin API (grants ORGANIZER on approval). DEV-ONLY secret.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_BACKEND_CLIENT_ID: getmyseat-backend
      KEYCLOAK_BACKEND_CLIENT_SECRET: getmyseat-backend-dev-secret
      # Shorten to watch Holds expire, e.g. `HOLD_TIME=30s docker compose up -d backend`.
      HOLD_TIME: ${HOLD_TIME:-10m}
      HOLD_CLEANUP_INTERVAL: ${HOLD_CLEANUP_INTERVAL:-30s}
      # Origins a browser may call the API from, comma-separated. Defaults to the Vite dev server.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # /bin/sh in the JRE image is dash, which has no /dev/tcp; use bash explicitly.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The k6 load test; run it with `docker compose run --rm k6` once the stack is up. Not started by `up`.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["loadtest"]
    command: ["run", "/load-test/holds.js"]
    working_dir: /load-test
    environment:
      BASE_URL: http://backend:8080
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_HOST: localhost:8180
    volumes:
      - ./load-test:/load-test
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
